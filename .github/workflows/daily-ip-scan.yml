name: Auto IP Pool Scan (累加)

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run IP Scanner
        run: python ip_scanner.py --full --max 80

      - name: Commit updated proxy files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proxyIP.txt proxyIP_cache.json
          git diff --staged --quiet || git commit -m "chore: auto IP scan $(date +%Y-%m-%d_%H:%M)"
          git push
