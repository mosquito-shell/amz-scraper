name: Auto IP Pool Scan

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: pip install requests urllib3

      - name: Scan IPs
        run: python3 ip_scanner.py --full --max 80

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proxyIP.txt proxyIP_cache.json
          git diff --staged --quiet || git commit -m "chore: IP scan $(date +%H:%M)"
          git push
