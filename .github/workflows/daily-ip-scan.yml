name: Auto IP Pool Scan (累加)

on:
  schedule:
    - cron: '23 */4 * * *'   # UTC 每4小时 (02:23, 06:23, 10:23, 14:23, 18:23, 22:23)
  workflow_dispatch:           # 手动触发

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install httpx urllib3

      - name: Run IP Scanner (累加模式)
        run: python ip_scanner.py --full --max 80
        working-directory: .

      - name: Commit updated proxy files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proxyIP.txt proxyIP_cache.json
          git diff --staged --quiet || git commit -m "chore: auto IP pool scan $(date +%Y-%m-%d_%H:%M)"
          git push
