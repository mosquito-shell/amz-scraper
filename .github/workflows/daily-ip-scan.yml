name: Auto IP Pool Scan

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: pip install requests urllib3

      - name: Purge CF CDN IPs from cache
        run: python3 ip_scanner.py --purge-cf

      - name: Scan IPs
        run: python3 ip_scanner.py --full --max 80

      - name: Commit proxy files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proxyIP.txt proxyIP_cache.json
          git diff --staged --quiet || git commit -m "chore: IP scan $(date +%H:%M)"
          git push

      - name: Sync to backend API
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path('proxyIP_cache.json')
          if not p.exists():
              print('proxyIP_cache.json missing', file=sys.stderr)
              sys.exit(1)
          data = json.loads(p.read_text(encoding='utf-8'))
          print('ips', len(data.get('ips', [])))
          PY
          curl -sSf -X POST https://api.tsscjn.top/api/ip-pool \
            -H 'Content-Type: application/json' \
            --data-binary @proxyIP_cache.json
